name: Helix Heal
description: Analyze failed Playwright runs and comment with selector healing suggestions.
author: Helix Heal

inputs:
  playwright-report:
    description: Path to a Playwright JSON report.
    required: false
    default: playwright-report.json
  test-results:
    description: Path to Playwright test results or trace artifacts.
    required: false
    default: test-results
  min-confidence:
    description: Minimum confidence score to include in the PR comment.
    required: false
    default: "0.75"
  github-token:
    description: GitHub token used to post PR comments.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install Helix Heal dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Build Helix Heal action
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    - name: Analyze Playwright failures
      shell: bash
      run: node "${{ github.action_path }}/packages/github-action/dist/index.js"
      env:
        INPUT_PLAYWRIGHT-REPORT: ${{ inputs.playwright-report }}
        INPUT_TEST-RESULTS: ${{ inputs.test-results }}
        INPUT_MIN-CONFIDENCE: ${{ inputs.min-confidence }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
