name: Helix Heal
description: Analyze failed Playwright runs and comment with selector healing suggestions.
author: Helix Heal

inputs:
  playwright-report:
    description: Path to a Playwright JSON report.
    required: false
    default: playwright-report.json
  test-results:
    description: Path to Playwright test results or trace artifacts.
    required: false
    default: test-results
  trace:
    description: Optional explicit path to a Playwright trace zip or extracted trace directory.
    required: false
    default: ""
  source-root:
    description: Directory used to resolve test source paths for dry-run patches.
    required: false
    default: "."
  min-confidence:
    description: Minimum confidence score to include in the PR comment.
    required: false
    default: "0.75"
  github-token:
    description: GitHub token used to post PR comments.
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: Path to the generated Helix Markdown report.
    value: ${{ steps.analyze.outputs.report-path }}
  patch-path:
    description: Path to the generated dry-run patch artifact.
    value: ${{ steps.analyze.outputs.patch-path }}
  suggestion-count:
    description: Number of selector-related suggestions.
    value: ${{ steps.analyze.outputs.suggestion-count }}
  patch-count:
    description: Number of safe dry-run patches.
    value: ${{ steps.analyze.outputs.patch-count }}
  artifact-name:
    description: Uploaded GitHub Actions artifact name.
    value: ${{ steps.analyze.outputs.artifact-name }}
  comment-action:
    description: Whether the PR comment was created or updated.
    value: ${{ steps.analyze.outputs.comment-action }}
  comment-id:
    description: GitHub PR comment ID when a comment was written.
    value: ${{ steps.analyze.outputs.comment-id }}

runs:
  using: composite
  steps:
    - name: Install Helix Heal dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Build Helix Heal action
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    - name: Analyze Playwright failures
      id: analyze
      shell: bash
      run: node "${{ github.action_path }}/packages/github-action/dist/index.js"
      env:
        HELIX_PLAYWRIGHT_REPORT: ${{ inputs.playwright-report }}
        HELIX_TEST_RESULTS: ${{ inputs.test-results }}
        HELIX_TRACE: ${{ inputs.trace }}
        HELIX_SOURCE_ROOT: ${{ inputs.source-root }}
        HELIX_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        HELIX_GITHUB_TOKEN: ${{ inputs.github-token }}
