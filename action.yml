name: Helix Heal
description: Analyze failed Playwright runs and comment with selector healing suggestions.
author: Helix Heal

inputs:
  playwright-report:
    description: Path to a Playwright JSON report.
    required: false
    default: playwright-report.json
  test-results:
    description: Path to Playwright test results or trace artifacts.
    required: false
    default: test-results
  trace:
    description: Optional explicit path to a Playwright trace zip or extracted trace directory.
    required: false
    default: ""
  source-root:
    description: Directory used to resolve test source paths for dry-run patches.
    required: false
    default: "."
  min-confidence:
    description: Minimum confidence score to include in the PR comment.
    required: false
    default: "0.75"
  github-token:
    description: GitHub token used to post PR comments.
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: Path to the generated Helix Markdown report.
  patch-path:
    description: Path to the generated dry-run patch artifact.
  dashboard-path:
    description: Path to the generated static HTML dashboard artifact.
  suggestion-count:
    description: Number of selector-related suggestions.
  patch-count:
    description: Number of safe dry-run patches.
  artifact-name:
    description: Uploaded GitHub Actions artifact name.
  comment-action:
    description: Whether the PR comment was created or updated.
  comment-id:
    description: GitHub PR comment ID when a comment was written.

runs:
  using: node20
  main: packages/github-action/dist/index.cjs
